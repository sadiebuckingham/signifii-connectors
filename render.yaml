# Render Blueprint for reference (services were created through the Render API, so this file isn't linked).
# Demos run together on one service; real clients each get their own service + database from this repo.
services:
  - type: web
    name: signifii-demos
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONNECTOR
        value: media-plan
      - key: CONNECTOR_TOKEN
        sync: false
      - key: PLAN_LINK_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        value: https://signifii-demos.onrender.com
databases:
  - name: signifii-demos-db
    region: frankfurt
    plan: basic-256mb
